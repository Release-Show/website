<!DOCTYPE html>
<!-- Source for assets/og.png (1200x630). Regenerate with tools/render-og.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f8f6f1; width: 1200px; height: 630px; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #15120f; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .photo { position: absolute; inset: 0; background: url("../assets/img/hero.webp") center / cover; opacity: .38; mix-blend-mode: multiply; -webkit-mask-image: linear-gradient(90deg, transparent 20%, #000 75%); }
  .leak { position: absolute; left: -160px; top: 40px; width: 760px; height: 560px; background: radial-gradient(closest-side, rgba(242,181,68,.45), transparent); filter: blur(40px); }
  .bar { position: absolute; left: 0; right: 0; height: 46px; background: #efebe3; }
  .bar--t { top: 0; } .bar--b { bottom: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 64px; font-family: "Geist Mono", monospace; font-size: 13px; letter-spacing: .14em; color: #625a50; }
  .content { position: absolute; inset: 46px 0; padding: 48px 64px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 30px; letter-spacing: -.05em; }
  .brand em { font-style: normal; color: #8a5a12; }
  .mark svg { width: 44px; height: 44px; display: block; }
  h1 { margin: 34px 0 0; font-weight: 600; font-size: 104px; line-height: .88; letter-spacing: -.055em; }
  h1 em { font-style: normal; color: #a06a10; }
  p { margin: 28px 0 0; max-width: 620px; font-size: 24px; line-height: 1.4; color: #625a50; }
</style>
</head>
<body>
<div class="card">
  <div class="photo"></div>
  <div class="leak"></div>
  <div class="bar bar--t"></div>
  <div class="content">
    <div class="brand"><span class="mark"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="17" fill="#15120f"/><path d="M23 17.5 47 32 23 46.5z" fill="#F2B544"/><circle cx="51" cy="13" r="4" fill="#e5484d"/></svg></span><span>release<em>.show</em></span></div>
    <h1>Every release<br>deserves a <em>premiere.</em></h1>
    <p>GitHub releases, merged PRs and site changes, turned into 30 to 90 second videos.</p>
  </div>
  <div class="bar bar--b"><span>SC. 01 · TK. 01 · 24 FPS</span><span>RELEASE.SHOW</span></div>
</div>
</body>
</html>
