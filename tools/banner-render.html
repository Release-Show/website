<!DOCTYPE html>
<!-- Source for assets/readme-banner.png (1280x400 @2x). Regenerate with tools/render-og.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #070606; width: 1280px; height: 400px; overflow: hidden; }
  .banner { position: relative; width: 1280px; height: 400px; overflow: hidden; color: #efe8dc; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .photo { position: absolute; inset: 0; background: url("../assets/img/finale.webp") center / cover; opacity: .55; -webkit-mask-image: linear-gradient(90deg, transparent 30%, #000 85%); }
  .glow { position: absolute; left: 0; right: 0; bottom: -200px; height: 420px; background: radial-gradient(ellipse at 50% 100%, rgba(242,181,68,.28), transparent 60%); }
  .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
  .content { position: absolute; inset: 0; padding: 40px 56px; display: grid; grid-template-rows: auto 1fr auto; }
  .top { display: flex; justify-content: space-between; align-items: center; font-family: "Geist Mono", monospace; font-size: 13px; letter-spacing: .16em; }
  .onair { display: flex; align-items: center; gap: 10px; }
  .onair i { width: 9px; height: 9px; border-radius: 50%; background: #e5484d; box-shadow: 0 0 0 5px rgba(229,72,77,.18); }
  .brand { display: flex; align-items: center; gap: 12px; font-family: "Geist", sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -.04em; }
  .brand em { font-style: normal; color: #F2B544; }
  .mark svg { width: 34px; height: 34px; display: block; }
  h1 { margin: 0; align-self: center; font-weight: 600; font-size: 78px; line-height: .9; letter-spacing: -.055em; }
  h1 em { font-style: normal; color: #F2B544; }
  .bottom { display: flex; justify-content: space-between; font-family: "Geist Mono", monospace; font-size: 13px; letter-spacing: .12em; color: #9c9488; }
  .rule { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: #F2B544; }
</style>
</head>
<body>
<div class="banner">
  <div class="photo"></div><div class="glow"></div><div class="scan"></div>
  <div class="content">
    <div class="top"><span class="onair"><i></i>ON AIR</span><span class="brand"><span class="mark"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="17" fill="#15120f"/><path d="M23 17.5 47 32 23 46.5z" fill="#F2B544"/><circle cx="51" cy="13" r="4" fill="#e5484d"/></svg></span><span>release<em>.show</em></span></span></div>
    <h1>Every release<br>deserves a <em>premiere.</em></h1>
    <div class="bottom"><span>RELEASES · PRS · SITE CHANGES → 30–90 S VIDEO</span><span>RELEASE.SHOW</span></div>
  </div>
  <div class="rule"></div>
</div>
</body>
</html>
