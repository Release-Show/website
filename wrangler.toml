# release.show on Cloudflare: a Worker that only serves static assets.
# No script runs; Cloudflare serves dist/ and applies _headers and _redirects.
# Build and deploy with tools/deploy.sh, never `wrangler deploy` from a working copy.
name = "releaseshow-website"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[routes]]
pattern = "release.show"
custom_domain = true

[[routes]]
pattern = "www.release.show"
custom_domain = true
